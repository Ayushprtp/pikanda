name: pikanda
description: "Pikanda — a private social/safety app for close friend groups. 🐼⚡"
publish_to: 'none'

version: 2.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  # state + navigation
  flutter_riverpod: ^2.6.1
  go_router: ^16.0.0

  # backend
  supabase_flutter: ^2.8.4
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5
  flutter_local_notifications: ^19.2.1

  # storage / local
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5

  # location + maps (SafeZap, distance widget)
  geolocator: ^14.0.1
  flutter_map: ^8.1.1
  latlong2: ^0.9.1

  # crypto (SafeZap payloads, whisper anonymity, safe codes)
  encrypt: ^5.0.3
  crypto: ^3.0.6

  # media
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  record: ^6.0.0
  just_audio: ^0.10.3

  # platform / device
  home_widget: ^0.7.0
  workmanager: ^0.9.0
  permission_handler: ^12.0.0
  url_launcher: ^6.3.1
  share_plus: ^11.0.0
  vibration: ^3.1.3
  local_auth: ^2.3.0
  device_info_plus: ^11.3.0

  # SMS (Android only — SafeZap)
  another_telephony: ^0.4.1

  # UI
  confetti: ^0.8.0
  fl_chart: ^1.0.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.0.0
  cupertino_icons: ^1.0.8

  # misc
  intl: ^0.20.2
  uuid: ^4.5.1

  # over-the-air code push (Shorebird)
  shorebird_code_push: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/icon.png"
  min_sdk_android: 23

flutter:
  uses-material-design: true
  assets:
    - shorebird.yaml
    - assets/images/
    - assets/images/avatar/
    - assets/card/

  fonts:
    - family: SF
      fonts:
        - asset: assets/fonts/SF-PRO-ROUNDED-BOLD.OTF
          weight: 700
        - asset: assets/fonts/SF-PRO-ROUNDED-LIGHT.OTF
          weight: 300
        - asset: assets/fonts/SF-PRO-ROUNDED-MEDIUM.OTF
          weight: 500
        - asset: assets/fonts/SF-PRO-ROUNDED-REGULAR.OTF
          weight: 400
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat.ttf
    - family: Pandastudio
      fonts:
        - asset: assets/fonts/pandastudio.ttf
    - family: Ethnocentric
      fonts:
        - asset: assets/fonts/Ethnocentric.otf
